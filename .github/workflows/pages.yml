name: Déploiement GitHub Pages

# Publie le contenu de docs/ tel quel (pas de traitement Jekyll).
# Remplace le builder "legacy" qui échouait avec « Page build failed. ».

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
